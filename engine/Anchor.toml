[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
engine = "DhKVzFTjzax7MeLEqiEXmEhm6ERSjehYaamqai5oPKZ7"
income_dispatcher = "DPwfwgErHSmKLjGkadA4EL1zcCKU1ZhdaMUyUzJtTqCN"

[programs.devnet]
engine = "DhKVzFTjzax7MeLEqiEXmEhm6ERSjehYaamqai5oPKZ7"
income_dispatcher = "DPwfwgErHSmKLjGkadA4EL1zcCKU1ZhdaMUyUzJtTqCN"


# [programs.remote]
# engine = "HMVJWXWhpxEWWGhvLHYnTvkmYJcA819jAxw3EgdNYiYb"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
litesvm = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/litesvm.ts"
litesvm-basic = "yarn run test:litesvm:basic"
litesvm-raydium = "yarn run test:litesvm:raydium"
litesvm-full = "yarn run test:litesvm:full"
pre-deploy-setup = "ts-node scripts/pre-deploy-setup.ts"
init-launch = "ts-node scripts/init-launch.ts"
init-roster = "ts-node scripts/init-roster.ts"
deposit = "ts-node scripts/deposit.ts"
create-clmm-pool = "ts-node scripts/create-clmm-pool.ts"
build-test = "anchor build -- --features test"
mint-spl = "ts-node scripts/mint-spl.ts"
