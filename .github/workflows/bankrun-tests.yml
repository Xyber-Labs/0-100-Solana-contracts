name: bankrun tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - "engine/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: "stable"
  SOLANA_VERSION: "1.18.18"
  ANCHOR_CLI_VERSION: "0.29.0"

defaults:
  run:
    working-directory: engine

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('engine/Cargo.lock') }}

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSfL "https://release.solana.com/v${SOLANA_VERSION}/install" | sh -s -
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Install anchor-cli
        shell: bash
        run: |
          set -euxo pipefail
          cargo install anchor-cli --version "${ANCHOR_CLI_VERSION}" --locked --force
          anchor --version

      - name: anchor build
        run: anchor build --skip-lint

      - name: Install deps & run ts-mocha
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            corepack prepare pnpm@latest --activate
            pnpm install --frozen-lockfile
            pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/bankrun.ts
          elif [[ -f yarn.lock ]]; then
            YARN_VER=$(yarn --version)
            if [[ "$YARN_VER" == 1.* ]]; then
              yarn install --frozen-lockfile
              if ! yarn --silent list --pattern '^ts-mocha($|@)' >/dev/null 2>&1; then
                yarn add -D ts-mocha
              fi
              yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/bankrun.ts
            else
              yarn install --immutable
              yarn dlx ts-mocha -p ./tsconfig.json -t 1000000 tests/bankrun.ts
            fi
          elif [[ -f package-lock.json ]]; then
            npm ci
            npx ts-mocha -p ./tsconfig.json -t 1000000 tests/bankrun.ts
          else
            npm install
            npx ts-mocha -p ./tsconfig.json -t 1000000 tests/bankrun.ts
          fi
