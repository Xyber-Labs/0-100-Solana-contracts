name: tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - "engine/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  SOLANA_VERSION: "2.1.0"
  ANCHOR_VERSION: "0.31.1"

defaults:
  run:
    working-directory: engine

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Restore Solana CLI cache
        id: solana-restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.local/share/solana/install
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana
        if: steps.solana-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash -s - v${{ env.SOLANA_VERSION }}
      
      - name: Add Solana to PATH
        shell: bash
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      
      - name: Verify Solana
        shell: bash
        run: solana --version


      - name: Install AVM and Anchor
        shell: bash
        run: |
          set -euxo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install ${ANCHOR_VERSION}
          avm use ${ANCHOR_VERSION}
          anchor --version

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Run tests
        env:
          TS_NODE_CACHE: "false"
        run: npx ts-mocha -p ./tsconfig.json -t 1000000 engine/tests/bankrun.ts

      - name: Save Solana CLI cache
        if: steps.solana-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.local/share/solana/install
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}
