name: tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - "engine/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: "2.1.0"

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:20-bullseye

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ runner.os }}-stable-${{ hashFiles('engine/Cargo.lock') }}

      - name: Restore Solana CLI cache
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: solana
