name: tests

on:
  workflow_dispatch:
  # pull_request:
  #   branches: ["main", "develop"]
  #   paths:
  #     - "engine/**"
  #     - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: "stable"
  SOLANA_VERSION: "2.1.0"
  ANCHOR_CLI_VERSION: "0.31.1"

defaults:
  run:
    working-directory: engine

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Solana and anchor
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash -s - v${SOLANA_VERSION}
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"        

      - name: anchor build
        run: anchor build --skip-lint

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('engine/Cargo.lock') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: anchor run litesvm
